name: Build and Release Artifacts

on:
  push:
    tags:
      - "v*"

  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: rtk_graphical-linux
          - os: windows-latest
            artifact_name: rtk_graphical-windows
          - os: macos-latest
            artifact_name: rtk_graphical-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev xorg-dev

      - name: Install Vulkan (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libvulkan-dev libglm-dev

      - name: Install Vulkan (macOS)
        if: runner.os == 'macOS'
        run: brew install vulkan-headers vulkan-loader glm

      - name: Install Vulkan (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install vulkan-sdk --no-progress -y

          $vcpkgExe = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          $glmInstalled = $false

          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "Installing GLM (attempt $attempt/4)..."

            $process = Start-Process `
              -FilePath $vcpkgExe `
              -ArgumentList "install", "glm:x64-windows" `
              -Wait `
              -NoNewWindow `
              -PassThru

            if ($process.ExitCode -eq 0) {
              $glmInstalled = $true
              break
            }

            if ($attempt -lt 4) {
              Start-Sleep -Seconds (15 * $attempt)
            }
          }

          if (-not $glmInstalled) {
            throw "Unable to install GLM after 4 attempts"
          }

          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

          $vulkanSdk = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          "VULKAN_SDK=$($vulkanSdk.FullName)" >> $env:GITHUB_ENV
          "$($vulkanSdk.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DRTK_REGENERATE_SHADERS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Install (Prepare Artifact)
        run: cmake --install build --prefix artifact_install --config Release

      - name: Zip Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd artifact_install
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz .

      - name: Zip Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "artifact_install\*" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            *.tar.gz
            *.zip