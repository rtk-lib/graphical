name: Build and Release Artifacts

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: rtk_graphical-linux
          - os: windows-latest
            artifact_name: rtk_graphical-windows
          - os: macos-latest
            artifact_name: rtk_graphical-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev xorg-dev

      - name: use vcpkg (Linux / macOS)
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DRTK_REGENERATE_SHADERS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Install (Prepare Artifact)
        run: cmake --install build --prefix artifact_install --config Release

      - name: Zip Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd artifact_install
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz .

      - name: Zip Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "artifact_install\*" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            *.tar.gz
            *.zip